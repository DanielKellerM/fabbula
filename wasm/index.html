<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>fabbula wasm</title>
  <style>
    :root {
      --gh-bg: #f6f8fa;
      --gh-surface: #ffffff;
      --gh-border: #d0d7de;
      --gh-text: #24292f;
      --gh-muted: #57606a;
      --gh-btn: #f6f8fa;
      --gh-btn-hover: #f3f4f6;
      --gh-accent: #0969da;
      --gh-subtle: #f6f8fa;
      --ok-bg: #dafbe1;
      --ok-fg: #116329;
      --ok-border: #b6e3bf;
      --warn-bg: #fff8c5;
      --warn-fg: #6e4f00;
      --warn-border: #eedb7c;
      --err-bg: #ffebe9;
      --err-fg: #cf222e;
      --err-border: #ffcecb;
      --canvas-bg: #ffffff;
    }
    body[data-theme="dark"] {
      --gh-bg: #0d1117;
      --gh-surface: #161b22;
      --gh-border: #30363d;
      --gh-text: #e6edf3;
      --gh-muted: #8b949e;
      --gh-btn: #21262d;
      --gh-btn-hover: #30363d;
      --gh-accent: #58a6ff;
      --gh-subtle: #0d1117;
      --ok-bg: #132a18;
      --ok-fg: #56d364;
      --ok-border: #1f6f3a;
      --warn-bg: #3b2f14;
      --warn-fg: #e3b341;
      --warn-border: #735c0f;
      --err-bg: #3f1719;
      --err-fg: #ff7b72;
      --err-border: #8e3b46;
      --canvas-bg: #0d1117;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--gh-bg);
      color: var(--gh-text);
      font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    }
    button, select, input, textarea {
      font: 13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
      color: var(--gh-text);
      border: 1px solid var(--gh-border);
      border-radius: 6px;
      background: var(--gh-surface);
      padding: 6px 8px;
    }
    button {
      background: var(--gh-btn);
      cursor: pointer;
      font-weight: 500;
    }
    button:hover { background: var(--gh-btn-hover); }
    button:disabled { opacity: .6; cursor: not-allowed; }
    input[type="checkbox"] { width: 14px; height: 14px; accent-color: var(--gh-accent); }
    pre { font: 12px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
    #theme-toggle {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 20;
    }
  </style>
</head>
<body>
  <button id="theme-toggle" type="button" aria-label="Toggle theme">🌙 Dark</button>
  <div id="boot" style="min-height:100vh;display:grid;place-items:center;color:var(--gh-text);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;">
    <div>
      <div style="font-size:14px;opacity:.8;color:var(--gh-muted);">fabbula</div>
      <div style="margin-top:6px;font-size:18px;">Loading WASM…</div>
      <div id="boot-detail" style="margin-top:8px;font-size:12px;color:var(--gh-muted);">Initializing module</div>
    </div>
  </div>
  <script type="module">
    const toggle = document.getElementById("theme-toggle");
    const key = "fabbula.theme";
    const setTheme = (theme) => {
      document.body.setAttribute("data-theme", theme);
      localStorage.setItem(key, theme);
      if (toggle) toggle.textContent = theme === "dark" ? "☀️ Light" : "🌙 Dark";
    };
    setTheme(localStorage.getItem(key) || "light");
    toggle?.addEventListener("click", () => {
      const cur = document.body.getAttribute("data-theme") || "light";
      setTheme(cur === "dark" ? "light" : "dark");
    });

    const boot = document.getElementById("boot");
    const detail = document.getElementById("boot-detail");
    try {
      const { default: init, start_app } = await import("../pkg/fabbula.js");
      detail.textContent = "Compiling wasm";
      await init();
      detail.textContent = "Starting app";
      await start_app();
      boot?.remove();
    } catch (err) {
      detail.textContent = `Failed to load: ${String(err)}`;
    }
  </script>
</body>
</html>
