<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>fabbula wasm</title>
  <style>
    body { margin: 0; background: #0f0f0f; }
  </style>
</head>
<body>
  <div id="boot" style="min-height:100vh;display:grid;place-items:center;color:#ddd;font-family:ui-monospace, SFMono-Regular, Menlo, monospace;">
    <div>
      <div style="font-size:14px;opacity:.8;">fabbula</div>
      <div style="margin-top:6px;font-size:18px;">Loading WASM…</div>
      <div id="boot-detail" style="margin-top:8px;font-size:12px;opacity:.7;">Initializing module</div>
    </div>
  </div>
  <script type="module">
    const boot = document.getElementById("boot");
    const detail = document.getElementById("boot-detail");
    try {
      const { default: init, start_app } = await import("../pkg/fabbula.js");
      detail.textContent = "Compiling wasm";
      await init();
      detail.textContent = "Starting app";
      await start_app();
      boot?.remove();
    } catch (err) {
      detail.textContent = `Failed to load: ${String(err)}`;
    }
  </script>
</body>
</html>
