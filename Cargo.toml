[package]
name = "fabbula"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
description = "Multi-PDK, DRC-aware image-to-GDSII artwork generator"
license = "Apache-2.0"
authors = ["Daniel Keller"]
keywords = ["gdsii", "asic", "chip-art", "pdk", "eda"]
categories = ["science", "command-line-utilities"]
repository = "https://github.com/DanielKellerM/fabbula"
homepage = "https://github.com/DanielKellerM/fabbula"
readme = "README.md"
exclude = ["profiling/", "outputs/", "media/", "docs/", "todo/"]

[features]
default = ["cli", "rayon", "gui"]
cli = ["dep:clap", "dep:tracing-subscriber"]
gui = ["dep:eframe", "dep:rfd"]
wasm = [
  "dep:wasm-bindgen",
  "dep:js-sys",
  "dep:serde-wasm-bindgen",
  "dep:wasm-bindgen-futures",
  "dep:web-sys",
]
rayon = ["dep:rayon"]

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
# GDSII I/O — gds21 is mature, serde-friendly, and part of Layout21
gds21 = "0.2"

# Image processing
image = "0.25"

# CLI
clap = { version = "4", features = ["derive"], optional = true }

# Config / PDK definitions
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# Error handling
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
  "env-filter",
], optional = true }

# Parallelism for large images
rayon = { version = "1", optional = true }

# R-tree spatial index for scalable DRC
rstar = "0.12"

# Gzip decompression for compressed GDS files
flate2 = "1"

# Temp file handling for GDS decompression
tempfile = "3"

# SVG rasterization (pure Rust)
resvg = "0.45"

# QR code generation
qrcode = "0.14"
eframe = { version = "0.33", optional = true }
rfd = { version = "0.15", optional = true }

# WASM bindings
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", optional = true, features = [
  "Window",
  "Location",
  "Storage",
  "Document",
  "Element",
  "HtmlElement",
  "Node",
  "EventTarget",
  "Event",
  "HtmlInputElement",
  "HtmlTextAreaElement",
  "HtmlSelectElement",
  "HtmlOptionElement",
  "HtmlButtonElement",
  "HtmlCanvasElement",
  "CanvasRenderingContext2d",
  "HtmlImageElement",
  "ImageData",
  "File",
  "FileList",
  "Blob",
  "FileReader",
  "ProgressEvent",
  "Url",
  "HtmlAnchorElement",
  "MouseEvent",
  "WheelEvent",
  "KeyboardEvent",
] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"

[profile.bench]
lto = "thin"
codegen-units = 1

[[bin]]
name = "fabbula"
path = "src/main.rs"
required-features = ["cli"]

[[bin]]
name = "lint-commits"
path = "util/lint-commits.rs"

[[bin]]
name = "gen_test_image"
path = "profiling/gen_test_image.rs"

[[bin]]
name = "profile_hotpaths"
path = "profiling/profile_hotpaths.rs"

[[bench]]
name = "bench_drc"
harness = false
path = "profiling/bench_drc.rs"

[[bench]]
name = "bench_polygon"
harness = false
path = "profiling/bench_polygon.rs"

[[bench]]
name = "bench_artwork"
harness = false
path = "profiling/bench_artwork.rs"

[[bench]]
name = "bench_die_scale"
harness = false
path = "profiling/bench_die_scale.rs"

[package.metadata.docs.rs]
all-features = true

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
criterion = { version = "0.5", features = ["html_reports"] }
insta = { version = "1", features = ["redactions"] }
proptest = "1"
